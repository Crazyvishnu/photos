name: Verify Android app
on:
  push:
    branches: [main]
    paths: ['photos-android/**', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['photos-android/**', '.github/workflows/android-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: photos-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify wrapper
        run: chmod +x gradlew && ./gradlew --version
      - name: Test, lint and build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace
